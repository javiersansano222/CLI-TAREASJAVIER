[project]
name = "tareas"
version = "0.1.0"
description = "Automatiza tareas repetitivas con ficheros desde la terminal"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich>=13",
    "send2trash>=2.1.0",
    "typer>=0.20",
]

[project.scripts]
tareas = "tareas.cli:app"
hola = "tareas.bienvenida:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tareas"]
